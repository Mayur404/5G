<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Industrial Smart AGV Robot">
  <defs>
    <linearGradient id="robotBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bumperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <rect x="8" y="10" width="32" height="28" rx="6" fill="#0f172a" opacity="0.25"/>
  <!-- Drive Tracks / Wheel Assemblies -->
  <rect x="10" y="7" width="22" height="5" rx="2" fill="#020617" stroke="#475569" stroke-width="0.8"/>
  <rect x="10" y="36" width="22" height="5" rx="2" fill="#020617" stroke="#475569" stroke-width="0.8"/>
  <!-- Main Industrial Chassis (Facing East / Right) -->
  <rect x="8" y="11" width="30" height="26" rx="5" fill="url(#robotBody)" stroke="#64748b" stroke-width="1.2"/>
  <!-- Front Safety Bumper -->
  <path d="M 38,13 C 41,13 43,15 43,18 L 43,30 C 43,33 41,35 38,35 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Caution Chevron Markings on Front -->
  <line x1="39" y1="16" x2="42" y2="19" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="39" y1="21" x2="42" y2="24" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="39" y1="26" x2="42" y2="29" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Central 360° LiDAR Dome -->
  <circle cx="21" cy="24" r="6" fill="#020617" stroke="#059669" stroke-width="1"/>
  <circle cx="21" cy="24" r="3.2" fill="#059669" opacity="0.85"/>
  <circle cx="21" cy="24" r="1.3" fill="#a7f3d0"/>
  <!-- 5G mMTC Telemetry Radio Antenna Stubs -->
  <circle cx="12" cy="15" r="1.8" fill="#38bdf8"/>
  <circle cx="12" cy="33" r="1.8" fill="#38bdf8"/>
</svg>
