<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="5G Connected Drone">
  <defs>
    <radialGradient id="rotorSpin" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="90%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="droneBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Rotor Blur Discs (4 Rotors) -->
  <circle cx="12" cy="12" r="8" fill="url(#rotorSpin)"/>
  <circle cx="36" cy="12" r="8" fill="url(#rotorSpin)"/>
  <circle cx="12" cy="36" r="8" fill="url(#rotorSpin)"/>
  <circle cx="36" cy="36" r="8" fill="url(#rotorSpin)"/>
  <!-- Rotor Hub Motors -->
  <circle cx="12" cy="12" r="2.4" fill="#020617" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="36" cy="12" r="2.4" fill="#020617" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="12" cy="36" r="2.4" fill="#020617" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="36" cy="36" r="2.4" fill="#020617" stroke="#64748b" stroke-width="0.8"/>
  <!-- Rotor Propeller Blades -->
  <line x1="6" y1="12" x2="18" y2="12" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="30" y1="12" x2="42" y2="12" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="6" y1="36" x2="18" y2="36" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="30" y1="36" x2="42" y2="36" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Carbon Fiber Structural Arms -->
  <line x1="12" y1="12" x2="24" y2="24" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="12" x2="24" y2="24" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <line x1="12" y1="36" x2="24" y2="24" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="36" x2="24" y2="24" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <!-- Central Drone Pod Body (Facing East / Right) -->
  <ellipse cx="23" cy="24" rx="10" ry="6.5" fill="url(#droneBody)" stroke="#475569" stroke-width="1.2"/>
  <!-- Front Sensor / Camera Pod -->
  <path d="M 31,21 C 34.5,22 36,23 36,24 C 36,25 34.5,26 31,27 Z" fill="#0284c7"/>
  <circle cx="34" cy="24" r="1.5" fill="#e0f2fe"/>
  <!-- Center 5G Avionics Core -->
  <circle cx="23" cy="24" r="3.2" fill="#020617"/>
  <circle cx="23" cy="24" r="1.5" fill="#38bdf8"/>
  <!-- Navigation LEDs -->
  <circle cx="36" cy="12" r="1.2" fill="#10b981"/> <!-- Right Green -->
  <circle cx="36" cy="36" r="1.2" fill="#ef4444"/> <!-- Left Red -->
  <circle cx="12" cy="24" r="1.2" fill="#f8fafc"/> <!-- Rear White Strobe -->
</svg>
