<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="5G Connected Autonomous Vehicle Side View">
  <defs>
    <linearGradient id="sideCarBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sideCarGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="wheelRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow under tires -->
  <ellipse cx="24" cy="37" rx="20" ry="3.5" fill="#0f172a" opacity="0.28"/>

  <!-- Main Chassis Side Body -->
  <path d="M 4,28 C 4,25 7,24 10,24 L 13,24 C 16,19 21,14 26,14 L 33,14 C 37,14 41,18 43,23 L 44.5,25 C 46,26 46.5,28 45.5,30 L 44,32 L 4,32 Z" fill="url(#sideCarBody)" stroke="#475569" stroke-width="1"/>

  <!-- Lower rocker panel and wheel arch cutouts -->
  <path d="M 4,31 L 7.5,31 A 6.5,6.5 0 0 1 18.5,31 L 29.5,31 A 6.5,6.5 0 0 1 40.5,31 L 44.5,31 L 44,33 L 4,33 Z" fill="#090d16"/>

  <!-- Windows Greenhouse / Cabin -->
  <path d="M 15,23.5 L 17,16 C 20.5,15.2 25,15 32,15 C 35.5,15 39,18 40.5,23.5 Z" fill="#090d16"/>

  <!-- Rear Side Window -->
  <path d="M 16.5,23 L 18,17 L 22.5,17 L 22.5,23 Z" fill="url(#sideCarGlass)"/>
  <!-- Front Side Window -->
  <path d="M 24,17 L 31.5,17 C 34.5,17 37.5,19.5 39,23 L 24,23 Z" fill="url(#sideCarGlass)"/>

  <!-- Roof-Mounted 5G Shark-Fin / V2X Antenna Puck -->
  <path d="M 20,14.5 L 21.5,11.5 L 23.5,14 Z" fill="#0284c7"/>
  <circle cx="21.5" cy="11.5" r="1" fill="#38bdf8"/>

  <!-- Front LED Headlight (Right Side) -->
  <path d="M 43,24.5 L 45.5,26.5 L 43.5,27.5 Z" fill="#fef08a"/>
  <!-- Rear LED Taillight Strip (Left Side) -->
  <rect x="3.8" y="25" width="2" height="3" rx="0.8" fill="#ef4444"/>

  <!-- Aerodynamic Character Line / Door Crease -->
  <line x1="18.5" y1="26.5" x2="39" y2="26.5" stroke="#475569" stroke-width="0.9"/>
  <!-- Door seam line -->
  <line x1="23.2" y1="23" x2="23.2" y2="30.5" stroke="#334155" stroke-width="0.8"/>

  <!-- Rear Wheel (x=13, y=31, r=5.5) -->
  <circle cx="13" cy="31" r="5.5" fill="#020617"/>
  <circle cx="13" cy="31" r="3.6" fill="url(#wheelRim)"/>
  <circle cx="13" cy="31" r="1.4" fill="#0f172a"/>
  <circle cx="13" cy="31" r="0.6" fill="#cbd5e1"/>

  <!-- Front Wheel (x=35, y=31, r=5.5) -->
  <circle cx="35" cy="31" r="5.5" fill="#020617"/>
  <circle cx="35" cy="31" r="3.6" fill="url(#wheelRim)"/>
  <circle cx="35" cy="31" r="1.4" fill="#0f172a"/>
  <circle cx="35" cy="31" r="0.6" fill="#cbd5e1"/>
</svg>
