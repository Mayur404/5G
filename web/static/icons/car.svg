<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Connected Autonomous Vehicle">
  <defs>
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="carGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="headlightGlow" x="-20%" y="-20%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Shadow -->
  <ellipse cx="24" cy="24" rx="20" ry="13" fill="#0f172a" opacity="0.25"/>
  <!-- Wheels / Tires -->
  <rect x="9" y="8" width="8" height="4" rx="1.5" fill="#020617"/>
  <rect x="31" y="8" width="8" height="4" rx="1.5" fill="#020617"/>
  <rect x="9" y="36" width="8" height="4" rx="1.5" fill="#020617"/>
  <rect x="31" y="36" width="8" height="4" rx="1.5" fill="#020617"/>
  <!-- Main Chassis Body (Facing East / Right) -->
  <path d="M 7,16 C 7,12 11,10 16,10 L 32,10 C 39,10 44,14 45,21 C 45.5,23 45.5,25 45,27 C 44,34 39,38 32,38 L 16,38 C 11,38 7,36 7,32 Z" fill="url(#carBody)" stroke="#475569" stroke-width="1.2"/>
  <!-- Side Mirrors -->
  <path d="M 27,9.5 L 29,7 L 31,9.5 Z" fill="#1e293b"/>
  <path d="M 27,38.5 L 29,41 L 31,38.5 Z" fill="#1e293b"/>
  <!-- Windshield and Windows Canopy -->
  <path d="M 24,13 C 28,13 33,14 36,17 C 37,18.5 37,29.5 36,31 C 33,34 28,35 24,35 L 15,34 C 13,34 12,32 12,30 L 12,18 C 12,16 13,14 15,14 Z" fill="#090d16"/>
  <!-- Front Windshield -->
  <path d="M 26,14 L 35,18 C 35.8,20 35.8,28 35,30 L 26,34 Z" fill="url(#carGlass)"/>
  <!-- Rear Windshield -->
  <path d="M 13,16 L 17,15 L 17,33 L 13,32 Z" fill="url(#carGlass)" opacity="0.75"/>
  <!-- Roof Surface -->
  <rect x="17" y="15" width="8" height="18" rx="2" fill="#1e293b"/>
  <!-- Roof-mounted 5G V2X / LiDAR Sensor Dome -->
  <circle cx="21" cy="24" r="3.2" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
  <circle cx="21" cy="24" r="1.3" fill="#e0f2fe"/>
  <!-- LED Headlights (Front Beam Emitters) -->
  <ellipse cx="43.5" cy="14" rx="2" ry="1.2" fill="#fef08a" filter="url(#headlightGlow)"/>
  <ellipse cx="43.5" cy="34" rx="2" ry="1.2" fill="#fef08a" filter="url(#headlightGlow)"/>
  <!-- Red LED Taillights -->
  <rect x="6.5" y="13.5" width="1.5" height="3" rx="0.5" fill="#ef4444"/>
  <rect x="6.5" y="31.5" width="1.5" height="3" rx="0.5" fill="#ef4444"/>
</svg>
