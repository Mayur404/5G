[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "proran"
version = "1.0.0"
description = "CARE: calibrated, attribution-rewarded proactive reservation for sliced 5G RAN handovers"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
web = ["Flask>=3.1,<4", "waitress>=3,<4"]
dev = ["pytest>=8,<9", "ruff==0.14.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
