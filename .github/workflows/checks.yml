name: Checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-web.txt
      - run: python -m pip install -e . --no-build-isolation
      - run: python -m ruff check src web tests
      - run: python -m ruff format --check src web tests
      - run: python -m compileall -q src web
      - run: python -m pytest -q
